<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/tema.css">
<link rel="stylesheet" href="../assets/hub.css">
<script src="../assets/tema.js" defer></script>
</head>
<body>
<header class="appbar"><div class="appbar-in">
  <a class="marca" href="../" aria-label="Voltar ao hub">
    <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" style="fill:var(--accent)"/><g fill="#fff"><rect x="6.5" y="7" width="3.6" height="18" rx="1.3"/><rect x="12" y="10.5" width="3.6" height="14.5" rx="1.3"/><rect x="17.5" y="14" width="3.6" height="11" rx="1.3"/><rect x="23" y="17.5" width="3.6" height="7.5" rx="1.3"/></g></svg>
    <span><b>PDC · SLMs</b><small>CEIA · UFG</small></span>
  </a>
  <nav class="appnav">
    <a href="../">Hub</a>
    <a href="{{GITHUB}}">GitHub</a>
    <button class="tema-btn" data-tema-alternar aria-label="Alternar tema claro/escuro"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg></button>
  </nav>
</div></header>

<main class="wrap">
  <section class="hero" data-revelar>
    <p class="eyebrow">Repositório · {{COUNT}} páginas</p>
    <h1 class="display">{{TITLE}}</h1>
    <p class="lede">{{DESCRIPTION}}</p>
    <div class="hero-acoes"><a class="btn" href="{{GITHUB}}">Ver no GitHub</a><a class="btn" href="../">Voltar ao hub</a></div>
  </section>
  <section class="secao">
    <div class="grade">
{{ITEMS}}
    </div>
  </section>
</main>

<footer class="rodape"><div class="wrap"><span>{{TITLE}}</span><span>Página gerada pelo hub a partir do repositório</span></div></footer>
</body>
</html>
